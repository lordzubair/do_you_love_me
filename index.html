<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question</title>
<style>
body{
    margin:0;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#ffeccf);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.box{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    transition:left .15s, top .15s;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

button{
    padding:10px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#yes{
    background:#4CAF50;
    color:white;
}

#no{
    background:#ff4d4d;
    color:white;
}
</style>
</head>
<body>

<div class="box" id="box">
    <h2>Do you love me? 😊</h2>

    <div class="buttons">
        <button id="yes">Yes ❤️</button>
        <button id="no">No 😒</button>
    </div>
</div>

<script>
const box = document.getElementById("box");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

const messages = [
    "🤨 Are you sure?",
    "Think again!",
    "Wrong answer 😂",
    "Nice try 😜",
    "Nope!",
    "The 'No' button is on vacation 🏖️",
    "System Error: 'No' not found.",
    "That's illegal. 🚨",
    "Try clicking Yes 😏"
];

function moveBox() {
    
    document.querySelector("h2").innerHTML = "<h2>Do You love me?❤️ </h2>";
    const padding = 20;

    const maxX = window.innerWidth - box.offsetWidth - padding;
    const maxY = window.innerHeight - box.offsetHeight - padding;

    const x = Math.random() * maxX + padding;
    const y = Math.random() * maxY + padding;

    box.style.left = x + "px";
    box.style.top = y + "px";
    box.style.transform = "none";
    document.querySelector("h2").innerHTML += messages[Math.floor(Math.random()*messages.length)];
}

noBtn.addEventListener("mouseenter", moveBox);

noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveBox();
});

yesBtn.addEventListener("click", function(){
    box.innerHTML = `
<h1>🎉 I knew it! ❤️</h1>
<p>You have an excellent taste. 😌</p>
`;
});
for(let i=0;i<30;i++){

    const heart=document.createElement("div");

    heart.innerHTML="❤️";
    heart.style.position="fixed";
    heart.style.left=Math.random()*window.innerWidth+"px";
    heart.style.top=window.innerHeight+"px";
    heart.style.fontSize=(20+Math.random()*25)+"px";

    heart.animate([
        {transform:"translateY(0)",opacity:1},
        {transform:"translateY(-700px)",opacity:0}
    ],{
        duration:2500+Math.random()*1000
    });

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),3500);
}
</script>

</body>
</html>
