<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question</title>
<style>
body{
    margin:0;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#ffeccf);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.box{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    transition:left .15s, top .15s;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

button{
    padding:10px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#yes{
    background:#4CAF50;
    color:white;
}

#no{
    background:#ff4d4d;
    color:white;
}
</style>
</head>
<body>

<div class="box" id="box">
    <h2>Do you love me? 😊</h2>

    <div class="buttons">
        <button id="yes">Yes ❤️</button>
        <button id="no">No 😒</button>
    </div>
</div>

<script>
const box = document.getElementById("box");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

function moveBox() {

    const padding = 20;

    const maxX = window.innerWidth - box.offsetWidth - padding;
    const maxY = window.innerHeight - box.offsetHeight - padding;

    const x = Math.random() * maxX + padding;
    const y = Math.random() * maxY + padding;

    box.style.left = x + "px";
    box.style.top = y + "px";
    box.style.transform = "none";
}

noBtn.addEventListener("mouseenter", moveBox);

noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveBox();
});

yesBtn.addEventListener("click", function(){
    alert("I knew it!❤️");
});
</script>

</body>
</html>
